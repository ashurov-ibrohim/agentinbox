<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentInbox</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <div>
      <h1>AgentInbox</h1>
      <p>Gmail + WebMCP</p>
    </div>

    <div class="auth-area">
      <a id="loginLink" class="button" href="/auth/login">
        Sign in with Google
      </a>

      <div id="userInfo" class="user-info hidden">
        <span id="userName"></span>
        <button id="logoutButton" class="button">Log out</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Inbox</h2>
      <p>View and manage your Gmail messages.</p>

      <button id="loadEmailsButton" class="button">
        Load emails
      </button>
    </section>

    <section id="status" class="status hidden"></section>

    <section id="emails" class="emails"></section>

    <section id="messageDetails" class="message-details hidden">
      <button id="closeMessageButton" class="close-button">✕</button>

      <div id="messageContent"></div>

      <div class="reply">
        <textarea
          id="replyText"
          placeholder="Write your reply..."
          rows="5"
        ></textarea>

        <button id="replyButton" class="button">
          Send reply
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
