<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentInbox</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <div>
      <h1>AgentInbox</h1>
      <p>Gmail + WebMCP</p>
    </div>

    <a class="button" href="/auth/login">
      Google bilan kirish
    </a>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Xatlar</h2>
      <p>Gmail xatlaringizni ko‘ring va boshqaring.</p>

      <button id="loadEmailsButton" class="button">
        Xatlarni yuklash
      </button>
    </section>

    <section id="status" class="status hidden"></section>

    <section id="emails" class="emails"></section>

    <section id="messageDetails" class="message-details hidden">
      <button id="closeMessageButton" class="close-button">✕</button>

      <div id="messageContent"></div>

      <div class="reply">
        <textarea
          id="replyText"
          placeholder="Javobingizni yozing..."
          rows="5"
        ></textarea>

        <button id="replyButton" class="button">
          Javob yuborish
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
